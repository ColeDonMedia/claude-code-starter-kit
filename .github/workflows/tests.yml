# The kit's own tests on every push and pull request, on Windows, macOS and Linux, on the oldest and newest Node the kit supports.
# Free for a public repository, no tokens, no secrets. Official actions only, pinned to exact commits (refresh them by hand:
# git ls-remote --tags --sort=-v:refname https://github.com/actions/<name>). `claude plugin validate` is not run here (no CLI).
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name "ci" && git config --global user.email "ci@example.com"
      - run: node --test plugins/starter-kit/hooks/*.test.mjs plugins/starter-kit/scripts/*.test.mjs
      - name: hook tests through the merged runner
        run: node --test plugins/starter-kit/hooks/*.test.mjs
        env:
          KIT_VIA_GATE: "1"
      # 2.21.0 shipped a test that passed on a slow computer and failed on fast ones. Every test file this push adds or changes
      # runs three more times here, so a test that passes only by luck or timing fails before anyone receives the release.
      - name: new and changed tests, three more times
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'plugins/starter-kit/*/*.test.mjs' | tr '\n' ' ')
          if [ -n "$files" ]; then for i in 1 2 3; do node --test $files || exit 1; done; else echo "no test files changed"; fi

  # Releases are pushed to the "candidate" branch (decision D7). Only when every test above passed does this move "main" (which
  # most computers update from) and "stable" to that commit, so no computer receives a release that failed on any system. A
  # direct push to main still moves stable only after passing. Fast-forward only: it never overwrites newer work on main.
  promote:
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/candidate' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: github.ref == 'refs/heads/candidate'
        run: git push origin "HEAD:refs/heads/main"
      - run: git push origin "HEAD:refs/heads/stable"
