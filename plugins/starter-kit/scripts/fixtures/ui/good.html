<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice 1042 — Acme Invoicing</title>
<link rel="icon" href="data:,">
<style>
  body { font: 16px/1.4 sans-serif; margin: 0; padding: 16px; }
  button, a.back { min-height: 44px; min-width: 44px; padding: 8px 16px; font-size: 16px; margin: 6px; }
  input { font-size: 16px; min-height: 44px; }
  td.num, th.num { text-align: right; }
  dialog { max-height: 80vh; overflow: auto; }
</style>
</head>
<body>
  <nav aria-label="Breadcrumb"><a class="back" href="/invoices">Back to invoices</a></nav>
  <h1>Invoice 1042</h1>
  <p>Sent 27 Nov 2026 to Zoë Ångström-Núñez</p>
  <button type="button" id="open">Delete invoice</button>
  <button type="button">Download PDF</button>
  <label>Search lines <input type="search"></label>
  <table><thead><tr><th><button type="button">Item</button></th><th class="num">Qty</th><th class="num">Price</th></tr></thead><tbody>
    <tr><td>Design</td><td class="num">3</td><td class="num">$1,200.00</td></tr>
    <tr><td>Build</td><td class="num">5</td><td class="num">$4,000.00</td></tr>
    <tr><td>Hosting</td><td class="num">12</td><td class="num">$240.00</td></tr>
  </tbody></table>
  <dialog id="confirm" aria-labelledby="confirm-title">
    <h2 id="confirm-title">Delete invoice 1042?</h2>
    <p>This cannot be undone.</p>
    <button type="button" id="keep">Keep invoice</button>
    <button type="button" class="primary">Delete invoice</button>
  </dialog>
  <script>
    const d = document.getElementById("confirm");
    document.getElementById("open").addEventListener("click", () => d.showModal());
    document.getElementById("keep").addEventListener("click", () => d.close());
  </script>
</body>
</html>
